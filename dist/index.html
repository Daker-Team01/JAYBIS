<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>제이비스 JAYBIS — 생애주기 AI 금융비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ============================ 디자인 토큰 ============================ */
:root{
  --teal-900:#0a2257; --teal-800:#0d2d77; --teal-700:#0047bb; --teal-600:#0047bb;
  --teal-500:#2f6bdb; --teal-400:#5b8def; --teal-300:#a9c5f7; --teal-100:#dbe7fb; --teal-50:#eef3fc;
  --ink:#0c1b1a; --slate-900:#0f172a; --slate-700:#334155; --slate-600:#475569;
  --slate-500:#64748b; --slate-400:#94a3b8; --slate-300:#cbd5e1;
  --line:#e7eeed; --line-soft:#eef3f2;
  --bg:#f6f7fa; --card:#ffffff;
  --pos:#0e9f6e; --pos-bg:#e7f7f0; --neg:#e02424; --neg-bg:#fdecec;
  --warn:#d97706; --warn-bg:#fdf3e7;
  --shadow-sm:0 1px 2px rgba(12,27,26,.05), 0 1px 3px rgba(12,27,26,.04);
  --shadow-md:0 2px 6px rgba(12,27,26,.05), 0 8px 24px rgba(12,27,26,.06);
  --shadow-lg:0 8px 24px rgba(12,27,26,.10), 0 18px 48px rgba(12,27,26,.10);
  --shadow-teal:0 10px 30px rgba(0,71,187,.26);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --tab-h:74px;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  font-family:'Noto Sans KR', system-ui, sans-serif;
  background:#11201f;
  color:var(--slate-900);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
:root[data-theme="dark"]{
  --bg:#070f1f; --card:#0f1b33; --line:#1d2c49; --line-soft:#172339;
  --ink:#eaf1ff; --slate-900:#eaf1ff; --slate-700:#c2d0ea; --slate-600:#a3b4d4;
  --slate-500:#8497b9; --slate-400:#697a9a; --slate-300:#516288;
}
img{ display:block; max-width:100%; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea{ font-family:inherit; }

/* ============================ 스테이지 / 디바이스 ============================ */
#stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(120% 80% at 50% -10%, #11214a 0%, #0a1428 55%, #060b18 100%);
}
.device-scaler{ transform-origin:center center; }
.device{
  width:418px; height:872px;
  background:#05100f;
  border-radius:56px;
  padding:14px;
  box-shadow:
    0 0 0 2px #1f2b2a,
    0 50px 90px rgba(0,0,0,.55),
    0 12px 30px rgba(0,0,0,.4),
    inset 0 0 3px rgba(255,255,255,.06);
  position:relative;
}
.screen{
  width:390px; height:844px;
  background:var(--bg);
  border-radius:44px;
  overflow:hidden;
  position:relative;
  isolation:isolate;
}
/* 노치 (iPhone 12 Pro) */
.notch{
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:164px; height:30px; background:#05100f;
  border-radius:0 0 20px 20px; z-index:90;
}
.notch::after{ /* 스피커 */
  content:''; position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:42px; height:5px; border-radius:3px; background:#15211f;
}
.notch::before{ /* 카메라 */
  content:''; position:absolute; top:9px; left:calc(50% + 38px);
  width:9px; height:9px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #1c3b38 0%, #0a1413 70%);
}
.home-indicator{
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  width:134px; height:5px; border-radius:3px; background:rgba(12,27,26,.32);
  z-index:95; pointer-events:none;
}
.home-indicator.on-dark{ background:rgba(255,255,255,.55); }

/* ============================ 상태바 ============================ */
.statusbar{
  position:absolute; top:0; left:0; right:0; height:47px; z-index:80;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 30px 0; pointer-events:none;
  font-weight:600;
}
.statusbar .sb-time{ font-size:15px; letter-spacing:.2px; font-variant-numeric:tabular-nums; }
.statusbar .sb-icons{ display:flex; align-items:center; gap:7px; }
.statusbar.light{ color:#fff; }
.statusbar.dark{ color:var(--ink); }

/* ============================ 앱 셸 ============================ */
.app{ position:absolute; inset:0; display:flex; flex-direction:column; }
.scroll{
  flex:1; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.scroll::-webkit-scrollbar{ display:none; }

/* 화면 전환 애니메이션 */
@keyframes screenIn{ from{ transform:translateY(10px);} to{ transform:none;} }
@keyframes fadeUp{ from{ transform:translateY(16px);} to{ transform:none;} }
@keyframes pop{ from{ transform:scale(.96);} to{ transform:none;} }
.screen-anim{ animation:screenIn .34s cubic-bezier(.22,.61,.36,1); }
/* transform-only entrance — content stays visible even if the animation never starts */
.stagger > *{ animation:fadeUp .55s cubic-bezier(.22,.61,.36,1) both; }

/* ============================ 공통 컴포넌트 클래스 ============================ */
.card{
  background:var(--card); border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm); padding:18px;
}
.card-flat{ background:var(--card); border-radius:var(--r-lg); padding:18px; border:1px solid var(--line); }
.muted{ color:var(--slate-500); }
.tnum{ font-variant-numeric:tabular-nums; letter-spacing:-.2px; }

.pill{
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  padding:5px 11px; border-radius:999px; font-size:12px; font-weight:600;
}
.pill-teal{ background:var(--teal-50); color:var(--teal-700); }
.pill-pos{ background:var(--pos-bg); color:var(--pos); }
.pill-warn{ background:var(--warn-bg); color:var(--warn); }
.pill-neg{ background:var(--neg-bg); color:var(--neg); }
.pill-ghost{ background:rgba(255,255,255,.16); color:#fff; }

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; height:54px; border-radius:16px; font-size:16px; font-weight:700;
  transition:transform .12s ease, filter .15s ease;
}
.btn:active{ transform:scale(.975); }
.btn-primary{ background:var(--teal-600); color:#fff; box-shadow:var(--shadow-teal); }
.btn-primary:active{ filter:brightness(.96); }
.btn-dark{ background:var(--ink); color:#fff; }
.btn-ghost{ background:var(--teal-50); color:var(--teal-700); }
.btn-line{ background:var(--card); color:var(--slate-700); border:1.5px solid var(--line); }

.divider{ height:1px; background:var(--line); }
.row{ display:flex; align-items:center; }
.between{ display:flex; align-items:center; justify-content:space-between; }

/* 탭바 */
.tabbar{
  height:var(--tab-h); flex-shrink:0; position:relative;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);
  display:flex; align-items:flex-start; justify-content:space-around;
  padding:9px 8px 0;
}
:root[data-theme="dark"] .tabbar{ background:rgba(21,33,31,.86); }
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--slate-400); font-size:10.5px; font-weight:600; padding-top:2px;
  transition:color .15s ease;
}
.tab.active{ color:var(--teal-600); }
.tab-fab{
  position:relative; top:-16px;
  width:58px; height:58px; border-radius:50%;
  background:linear-gradient(160deg, var(--teal-500), var(--teal-700));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(0,71,187,.4), inset 0 1px 1px rgba(255,255,255,.3);
  flex:0 0 auto;
}
.tab-fab-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; }
.tab-fab-label{ font-size:10.5px; font-weight:700; color:var(--teal-600); margin-top:-9px; }

/* 게이지 라벨 */
.gauge-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; }
.gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }

/* 진행 막대 */
.bar{ height:9px; border-radius:6px; background:var(--line); overflow:hidden; }
.bar > i{ display:block; height:100%; border-radius:6px; }

/* 헤더 hero */
.hero{
  position:relative;
  background:linear-gradient(168deg, var(--teal-700) 0%, var(--teal-600) 58%, var(--teal-500) 130%);
  color:#fff;
  padding:62px 22px 26px;
  border-radius:0 0 28px 28px;
  overflow:hidden;
}
.hero::after{
  content:''; position:absolute; top:-40px; right:-30px;
  width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.16), transparent 65%);
}

/* 리스트 행 */
.lrow{ display:flex; align-items:center; gap:13px; padding:13px 0; }
.lrow + .lrow{ border-top:1px solid var(--line); }
.ic-chip{
  width:42px; height:42px; border-radius:13px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
}

/* 채팅 */
.bubble{ max-width:78%; padding:12px 15px; border-radius:18px; font-size:14.5px; line-height:1.5; }
.bubble-ai{ background:var(--card); border:1px solid var(--line); border-bottom-left-radius:6px; color:var(--slate-900); box-shadow:var(--shadow-sm); }
.bubble-me{ background:var(--teal-600); color:#fff; border-bottom-right-radius:6px; align-self:flex-end; }
.tool-line{
  display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--slate-500);
  padding:7px 12px; background:var(--teal-50); border-radius:11px; border:1px solid var(--teal-100);
}
.dot-pulse{ width:7px; height:7px; border-radius:50%; background:var(--teal-500); animation:pulse 1s infinite; }
@keyframes pulse{ 0%,100%{ opacity:.35; transform:scale(.85);} 50%{ opacity:1; transform:scale(1.15);} }
@keyframes spin{ to{ transform:rotate(360deg);} }

/* 토스트 */
.toast{
  position:absolute; left:18px; right:18px; bottom:calc(var(--tab-h) + 14px); z-index:120;
  background:var(--ink); color:#fff; border-radius:14px; padding:13px 16px;
  font-size:13.5px; font-weight:500; box-shadow:var(--shadow-lg);
  display:flex; align-items:center; gap:10px;
  animation:pop .25s ease;
}

/* 슬라이더 */
input[type=range].sim{
  -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:6px;
  background:var(--line); outline:none;
}
input[type=range].sim::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%;
  background:#fff; border:3px solid var(--teal-600); box-shadow:var(--shadow-md); cursor:grab;
}
input[type=range].sim::-moz-range-thumb{
  width:26px; height:26px; border-radius:50%; background:#fff; border:3px solid var(--teal-600); cursor:grab;
}

.seg{ display:flex; background:var(--line-soft); border-radius:12px; padding:3px; gap:3px; }
.seg button{ flex:1; height:34px; border-radius:9px; font-size:13px; font-weight:600; color:var(--slate-500); }
.seg button.on{ background:var(--card); color:var(--teal-700); box-shadow:var(--shadow-sm); }
</style>
  <script type="module" crossorigin src="/assets/index-BIjPbUQL.js"></script>
</head>
<body>
<div id="stage">
  <div class="device-scaler" id="scaler">
    <div class="device">
      <div class="screen">
        <div class="notch"></div>
        <div id="root"></div>
      </div>
    </div>
  </div>
</div>
<div id="tweaks-root"></div>

<script>
/* 디바이스 스케일링 — 뷰포트에 맞춰 레터박스 */
(function(){
  function fit(){
    var d=document.getElementById('scaler');
    if(!d) return;
    var W=418+0, H=872+0;
    var s=Math.min((window.innerWidth-32)/W, (window.innerHeight-32)/H, 1.1);
    d.style.transform='scale('+s+')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('DOMContentLoaded', fit);
  fit();
})();
</script>

</body>
</html>
